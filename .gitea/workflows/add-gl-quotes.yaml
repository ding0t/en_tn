name: Add GL Quotes to TSV Files

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  process-tsv:
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3

      - name: Install add-gl-quotes-to-tsv-files cli from npmjs.com
        run: npm install --global add-gl-quotes-to-tsv-files

      - name: Debugging
        run: |
          pwd
          echo "GITHUB_SERVER_URL: ${{ github.server_url }}"
          echo "vars.TSV_ISSUE_ASSIGNEES: ${{ vars.TSV_ISSUE_ASSIGNEES }}"
          echo "github.workspace: ${{github.workspace}}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.event.repository_name: ${{ github.event.repository.name }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo `which add-gl-quotes-to-tsv-files`
          add-gl-quotes-to-tsv-files --help
          add-gl-quotes-to-tsv-files --version

      - name: Process TSV files
        run: add-gl-quotes-to-tsv-files --zip --tsv --debug

      - name: ls working dir
        run: ls -l

      - name: Check if zip file exists
        id: check_zip
        run: |
          if ls *_with_gl_quotes.zip 1> /dev/null 2>&1; then
            echo "zip_exists=true" >> $GITHUB_OUTPUT
          else
            echo "zip_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload ZIP to S3
        if: steps.check_zip.outputs.zip_exists == 'true' && secrets.AWS_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_BUCKET:-}" ]; then
            echo "AWS_BUCKET secret not set; skipping S3 upload."
            exit 0
          fi
          echo "Uploading ZIP file(s) to s3://$AWS_BUCKET/dcs/"
          if ! command -v aws >/dev/null 2>&1; then
            echo "AWS CLI not found; installing AWS CLI v2 (bundled)"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            if command -v unzip >/dev/null 2>&1; then
              unzip -q awscliv2.zip
            else
              echo "'unzip' not found; extracting with Python"
              python3 -c "import zipfile; zipfile.ZipFile('awscliv2.zip').extractall('.')"
            fi
            ./aws/install -i "$PWD/aws-cli" -b "$PWD/bin"
            export PATH="$PWD/bin:$PATH"
          fi
          for f in *_with_gl_quotes.zip; do
            [ -e "$f" ] || continue
            echo "Uploading $f -> s3://$AWS_BUCKET/dcs/$f"
            aws s3 cp "$f" "s3://$AWS_BUCKET/dcs/$f" --only-show-errors --content-type application/zip
          done

      - name: Attach zip file to release if it is a tag
        if: steps.check_zip.outputs.zip_exists == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: akkuman/gitea-release-action@v1
        with:
          files: |-
            *_with_gl_quotes.zip

      - name: Removes zip file for upload as artifact
        run: rm *.zip && rm -rf .git && ls -l

      - name: Upload as artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: '${{ github.event.repository.name }}_${{ github.ref_name }}_with_gl_quotes'
          path: '.'      
